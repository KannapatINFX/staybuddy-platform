services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: staybuddy
      POSTGRES_PASSWORD: staybuddy
      POSTGRES_USER: staybuddy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staybuddy"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - staybuddy_postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - staybuddy_redis:/data

volumes:
  staybuddy_postgres:
  staybuddy_redis:
